name: HammerSim CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: hammersim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential m4 scons libboost-all-dev libhdf5-dev libpng-dev \
            libprotobuf-dev pkg-config protobuf-compiler python3-dev \
            zlib1g zlib1g-dev

      - name: Validate Python and device maps
        run: |
          python3 -m compileall -q configs util
          for map in util/hammersim/*-device-map.json; do
            python3 -m json.tool "$map" >/dev/null
          done

      - name: Build gem5
        run: |
          if ! /usr/bin/scons --ignore-style build/NULL/gem5.opt -j2; then
            find build -name scons_config.log -print -exec tail -n 250 {} \;
            exit 1
          fi

      - name: Run stock DRAM smoke test
        run: |
          build/NULL/gem5.opt --outdir=m5out-stock \
            configs/dram/rowhammer/TrafficGen/test-scripts/simple_dram.py

      - name: Run HammerSim corruption and ECC smoke test
        run: |
          build/NULL/gem5.opt --outdir=m5out-hammersim \
            configs/dram/rowhammer/TrafficGen/hammersim_smoke.py
          grep -Eq 'rowHammerTotalBitflips[[:space:]]+3([[:space:]]|$)' \
            m5out-hammersim/stats.txt
          grep -Eq 'rowHammerSingleSidedBitflips[[:space:]]+1([[:space:]]|$)' \
            m5out-hammersim/stats.txt
          grep -Eq 'rowHammerDoubleSidedBitflips[[:space:]]+1([[:space:]]|$)' \
            m5out-hammersim/stats.txt
          grep -Eq 'rowHammerHalfDoubleBitflips[[:space:]]+1([[:space:]]|$)' \
            m5out-hammersim/stats.txt
          grep -Eq 'rowHammerCorruptedBitCount[[:space:]]+3([[:space:]]|$)' \
            m5out-hammersim/stats.txt
          grep -Eq 'rowHammerEccCorrected[[:space:]]+3([[:space:]]|$)' \
            m5out-hammersim/stats.txt

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hammersim-ci-logs
          path: |
            build/NULL/gem5.build/scons_config.log
            m5out-stock/
            m5out-hammersim/
